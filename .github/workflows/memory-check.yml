name: memory-check

# Гоняем на обеих системах намеренно: половина ловушек в проверке - про
# расхождение Windows и Linux (регистр имён, связанные каталоги, окончания
# строк). На одной системе такие дефекты не видны.

on:
  push:
  pull_request:

# Читать репозиторий - всё, что нужно. Файл копируют к себе, поэтому права
# сужаем явно, а не полагаемся на умолчание чужого репозитория.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # Без этого тесты хука молча пропустятся там, где не нашёлся sh, и job
    # станет зелёным при невыполненной проверке.
    env:
      MEMCHECK_REQUIRE_SH: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Тесты
        run: python -m unittest discover -s scripts -v

      - name: Проверка собственной памяти репозитория
        run: python scripts/check_memory_index.py memory
